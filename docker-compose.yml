# Used for local development only. Do not reintroduce this on production :)

services:
  pg:
    image: pgvector/pgvector:pg18-trixie
    container_name: pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - be_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  be:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: be
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pg:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - fe_net
      - be_net
    depends_on:
      pg:
        condition: service_healthy

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: fe
    restart: unless-stopped
    networks:
      - fe_net
    depends_on:
      - be

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - fe_net
    depends_on:
      - fe
      - be

networks:
  fe_net:
  be_net:

volumes:
  pg_data: