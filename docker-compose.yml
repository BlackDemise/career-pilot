services:
  pg:
    image: pgvector/pgvector:pg18-trixie
    container_name: pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql
    ports: # Keep this for dev convenience
      - "5432:5432"
    networks:
      - be_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - be_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  be:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: be
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pg:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS}
      JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME}
      JWT_REFRESH_COOKIE_PATH: ${JWT_REFRESH_COOKIE_PATH}
      JWT_REFRESH_COOKIE_SECURE: ${JWT_REFRESH_COOKIE_SECURE}
      JWT_REFRESH_COOKIE_SAME_SITE: ${JWT_REFRESH_COOKIE_SAME_SITE}
    ports: # Keep this for dev convenience
      - "8080:8080"
    networks:
      - fe_net
      - be_net
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: fe
    restart: unless-stopped
    networks:
      - fe_net
    depends_on:
      - be

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - fe_net
    depends_on:
      - fe
      - be

networks:
  fe_net:
  be_net:

volumes:
  pg_data: