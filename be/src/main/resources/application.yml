server:
  port: 8080

spring:
  application:
    name: career-pilot
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE}

ai:
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL}
    temperature: ${GEMINI_TEMPERATURE}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS}
    timeout-ms: ${GEMINI_TIMEOUT_MS}
    max-retries: ${GEMINI_MAX_RETRIES:2}
    retry-backoff-ms: ${GEMINI_RETRY_BACKOFF_MS:500}

app:
  cv:
    max-file-size-bytes: ${CV_MAX_FILE_SIZE_BYTES:5242880}
  email:
    from: ${MAIL_FROM}
    frontend-base-url: ${FRONTEND_BASE_URL}
    registration-path: ${REGISTRATION_VERIFICATION_PATH}
    password-reset-path: ${PASSWORD_RESET_PATH}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS}
    refresh-cookie:
      name: ${JWT_REFRESH_COOKIE_NAME}
      path: ${JWT_REFRESH_COOKIE_PATH}
      secure: ${JWT_REFRESH_COOKIE_SECURE}
      same-site: ${JWT_REFRESH_COOKIE_SAME_SITE}